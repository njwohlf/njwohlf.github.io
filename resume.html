<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - Personal Portfolio</title>

  <!-- Main Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Theme Skins -->
  <link rel="stylesheet" href="css/skins/color-1.css" class="alternate-style" title="color-1">
  <link rel="stylesheet" href="css/skins/color-2.css" class="alternate-style" title="color-2" disabled>
  <link rel="stylesheet" href="css/skins/color-3.css" class="alternate-style" title="color-3" disabled>
  <link rel="stylesheet" href="css/skins/color-4.css" class="alternate-style" title="color-4" disabled>
  <link rel="stylesheet" href="css/skins/color-5.css" class="alternate-style" title="color-5" disabled>
  <link rel="stylesheet" href="css/skins/color-6.css" class="alternate-style" title="color-6" disabled>
  <link rel="stylesheet" href="css/skins/color-7.css" class="alternate-style" title="color-7" disabled>
  <link rel="stylesheet" href="css/skins/color-8.css" class="alternate-style" title="color-8" disabled>
</head>
<body>
  <!-- Navbar -->
  <header>
    <div id="navbar-container"></div>
    <script>
      fetch('partials/navbar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar-container').innerHTML = data;
        })
        .catch(error => console.error('Error loading navbar:', error));
    </script>
  </header>

  <!-- Resume Section -->
  <section id="resume">
    <div class="resume-container">
      <h1><i class="fa-solid fa-file" style="margin-right: 10px;"></i> My Resume</h1>
      <iframe src="assets/resume.pdf"></iframe>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>
  <script>
    fetch('partials/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(error => console.error('Error loading footer:', error));
  </script>

  <!-- Main JS -->
  <script src="js/script.js" defer></script>

  <!-- Inline Page-Specific Styles -->
  <style>
    .resume-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: var(--bg-color, #fff);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    .resume-container h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--skin-color);
    }

    .resume-container iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
    }
  </style>
</body>
</html>
