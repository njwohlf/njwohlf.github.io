<section class="hero container" aria-labelledby="intro-title">
  <div class="hero-copy">
    <h1 id="intro-title">Hi, I’m Nick.</h1>
    <p class="hero-intro">
      I’m a software developer who enjoys making useful things and figuring out
      how they work. Outside of work, I’m usually flying drones, building small
      projects, or watching horror films.
    </p>
    <div class="actions">
      <a class="button" href="/projects/"
        >View projects <span aria-hidden="true">↗</span></a
      ><a class="button button-secondary" href="/resume/"
        >View resume <span aria-hidden="true">↗</span></a
      >
    </div>
  </div>
  <figure class="hero-portrait">
    <div class="portrait-frame">
      <img
        src="/assets/images/wohlfeil_pic.jpeg"
        alt="Studio headshot of Nick Wohlfeil"
        width="1956"
        height="1777"
        fetchpriority="high"
      />
    </div>
  </figure>
</section>
<section class="container section featured-work" aria-labelledby="featured-title">
  <div class="section-heading">
    <h2 id="featured-title">Selected projects</h2>
    <a class="text-link" href="/projects/">All projects <span aria-hidden="true">↗</span></a>
  </div>
  <div class="project-grid">
    $featured_projects
  </div>
</section>
