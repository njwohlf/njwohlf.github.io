<section class="page-intro container">
  <h1>Projects</h1>
</section>
<section
  class="container section projects-section"
  aria-labelledby="collection-title"
>
  <h2 id="collection-title" class="sr-only">Project collection</h2>
  <div class="project-controls" hidden>
    <div
      class="filter-group"
      role="group"
      aria-label="Filter projects by category"
    >
      <button
        type="button"
        class="filter-button"
        data-filter="All"
        aria-pressed="true"
      >
        All work</button
      ><button
        type="button"
        class="filter-button"
        data-filter="Personal"
        aria-pressed="false"
      >
        Personal</button
      ><button
        type="button"
        class="filter-button"
        data-filter="Research"
        aria-pressed="false"
      >
        Research</button
      ><button
        type="button"
        class="filter-button"
        data-filter="Academic"
        aria-pressed="false"
      >
        Academic
      </button>
    </div>
    <div class="view-toggle" role="group" aria-label="Project layout">
      <button type="button" data-view="grid" aria-pressed="true">Grid</button
      ><button type="button" data-view="list" aria-pressed="false">List</button>
    </div>
  </div>
  <p
    id="project-count"
    class="small muted"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    9 projects
  </p>
  <div class="project-grid" id="projects-grid">$all_projects</div>
</section>
