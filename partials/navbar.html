<header class="site-header">
  <div class="nav-shell container">
    <a
      class="wordmark"
      href="/"
      aria-label="Nicholas Wohlfeil, home"
      ><span class="name-first">Nicholas</span
      ><span class="name-last">Wohlfeil</span></a
    >
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="primary-navigation"
      hidden
    >
      Menu <span aria-hidden="true">+</span>
    </button>
    <nav id="primary-navigation" aria-label="Main navigation">
      <ul class="nav-links">
        $nav_links
      </ul>
    </nav>
    <details class="appearance" hidden>
      <summary aria-label="Appearance settings">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8" />
          <path
            d="M12 4v16a8 8 0 0 0 0-16Z"
            fill="currentColor"
            stroke="none"
          /></svg
        ><span class="sr-only">Appearance</span>
      </summary>
      <div class="appearance-panel">
        <fieldset>
          <legend>Appearance</legend>
          <div class="theme-options">
            <button
              type="button"
              data-theme-choice="light"
              aria-pressed="false"
            >
              Light
            </button>
            <button type="button" data-theme-choice="dark" aria-pressed="false">
              Dark
            </button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Accent color</legend>
          <div class="color-options">
            <button
              type="button"
              class="swatch"
              data-color="color-1"
              aria-label="Rose accent"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="swatch"
              data-color="color-2"
              aria-label="Copper accent"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="swatch"
              data-color="color-3"
              aria-label="Amber accent"
              aria-pressed="true"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="swatch"
              data-color="color-4"
              aria-label="Blue accent"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="swatch"
              data-color="color-5"
              aria-label="Plum accent"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="swatch"
              data-color="color-6"
              aria-label="Teal accent"
              aria-pressed="false"
            >
              <span aria-hidden="true"></span>
            </button>
          </div>
        </fieldset>
        <p class="small muted">Preferences stay in this browser.</p>
      </div>
    </details>
  </div>
</header>
